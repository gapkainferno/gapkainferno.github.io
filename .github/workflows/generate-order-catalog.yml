name: Update and validate order catalog

on:
  push:
    branches: [master, cleanup/ukraine-only-no-telegram]
    paths:
      - 'products.js'
      - 'cart.js'
      - 'scripts/generate-order-catalog.js'
      - '.github/workflows/generate-order-catalog.yml'
  pull_request:
    paths:
      - 'products.js'
      - 'cart.js'
      - 'modal-init.js'
      - 'security-enhancements.js'
      - 'product.html'
      - 'index.html'
      - 'growing-guide.html'
      - 'scripts/check-inline-scripts.js'
      - 'google-script-config.js'
      - 'scripts/generate-order-catalog.js'
      - 'catalog.js'
      - 'googlescript.js'
      - 'order-catalog.json'
      - '.github/workflows/generate-order-catalog.yml'
  workflow_dispatch:

# Serialize catalog updates per branch to avoid competing commits.
concurrency:
  group: order-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-commit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check source syntax
        run: |
          node --check products.js
          node --check cart.js
      - name: Generate canonical order catalog
        run: node scripts/generate-order-catalog.js
      - name: Commit catalog when changed
        run: |
          if git diff --quiet -- order-catalog.json; then
            echo "order-catalog.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add order-catalog.json
          git commit -m "Auto-update order catalog"
          git push

  validate-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check cart.js
          node --check modal-init.js
          node --check security-enhancements.js
          node scripts/check-inline-scripts.js
          node --check products.js
          node --check googlescript.js
          node --input-type=module --check < catalog.js
      - name: Verify catalog can be generated
        run: node scripts/generate-order-catalog.js
