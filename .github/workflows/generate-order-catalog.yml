name: Generate order catalog
on:
  push:
    branches: [master, cleanup/ukraine-only-no-telegram]
    paths:
      - 'products.js'
      - 'cart.js'
      - 'modal-init.js'
      - 'product.html'
      - 'index.html'
      - 'google-script-config.js'
      - 'catalog.js'
      - 'googlescript.js'
      - 'scripts/generate-order-catalog.js'
      - '.github/workflows/generate-order-catalog.yml'
  pull_request:
    paths:
      - 'products.js'
      - 'cart.js'
      - 'catalog.js'
      - 'googlescript.js'
      - 'scripts/generate-order-catalog.js'
      - '.github/workflows/generate-order-catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check cart.js
          node --check modal-init.js
          node --check products.js
          node --check googlescript.js
          node --input-type=module --check < catalog.js
      - name: Generate canonical order catalog
        run: node scripts/generate-order-catalog.js
      - name: Commit generated catalog
        if: github.event_name == 'push'
        run: |
          git add order-catalog.json
          if git diff --cached --quiet -- order-catalog.json; then
            echo "Catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate canonical order catalog"
          git push
