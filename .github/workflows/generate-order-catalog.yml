name: Validate order catalog

on:
  push:
    branches: [master, cleanup/ukraine-only-no-telegram]
    paths:
      - 'products.js'
      - 'cart.js'
      - 'modal-init.js'
      - 'security-enhancements.js'
      - 'product.html'
      - 'index.html'
      - 'growing-guide.html'
      - 'scripts/check-inline-scripts.js'
      - 'google-script-config.js'
      - 'catalog.js'
      - 'googlescript.js'
      - 'scripts/generate-order-catalog.js'
      - 'order-catalog.json'
      - '.github/workflows/generate-order-catalog.yml'
  pull_request:
    paths:
      - 'products.js'
      - 'cart.js'
      - 'modal-init.js'
      - 'security-enhancements.js'
      - 'product.html'
      - 'index.html'
      - 'growing-guide.html'
      - 'scripts/check-inline-scripts.js'
      - 'google-script-config.js'
      - 'catalog.js'
      - 'googlescript.js'
      - 'scripts/generate-order-catalog.js'
      - 'order-catalog.json'
      - '.github/workflows/generate-order-catalog.yml'
  workflow_dispatch:

# Validation does not need write access. Serialize runs per branch so an older
# run cannot race a newer one or attempt to push generated files.
permissions:
  contents: read

concurrency:
  group: order-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check cart.js
          node --check modal-init.js
          node --check security-enhancements.js
          node scripts/check-inline-scripts.js
          node --check products.js
          node --check googlescript.js
          node --input-type=module --check < catalog.js
      - name: Generate and validate canonical order catalog
        run: |
          node scripts/generate-order-catalog.js
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const committed = JSON.parse(
            execFileSync('git', ['show', 'HEAD:order-catalog.json'], { encoding: 'utf8' })
          );
          const generated = JSON.parse(fs.readFileSync('order-catalog.json', 'utf8'));

          // generatedAt is intentionally time-dependent; all business data must match.
          delete committed.generatedAt;
          delete generated.generatedAt;

          if (JSON.stringify(generated) !== JSON.stringify(committed)) {
            console.error('order-catalog.json is out of date. Regenerate it and commit the updated file.');
            process.exit(1);
          }

          console.log('Canonical order catalog matches products.js and SALE_SETTINGS.');
          NODE
