name: Generate order catalog
on:
  push:
    branches: [master]
    paths:
      - 'products.js'
      - 'cart.js'
      - 'scripts/generate-order-catalog.js'
      - '.github/workflows/generate-order-catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate canonical order catalog
        run: node scripts/generate-order-catalog.js
      - name: Commit generated catalog
        run: |
          if git diff --quiet -- order-catalog.json; then
            echo "Catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add order-catalog.json
          git commit -m "chore: regenerate canonical order catalog"
          git push
